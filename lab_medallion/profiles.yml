lab_medallion:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: lab_medallion.duckdb
      threads: 4
      settings:
        TimeZone: UTC
      extensions:
        - httpfs
        - aws
      secrets:
        - type: s3
          provider: credential_chain
          chain: config
          profile: default
          region: us-east-1
          endpoint: s3.seaweedfs.adm.adaltas.cloud
          url_style: path
          use_ssl: true
          scope: "s3://{{ env_var('LAB_BUCKET_NAME') }}/"
