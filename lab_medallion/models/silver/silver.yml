models:
  - name: stg_users
    description: Cleaned and validated users.
    columns:
      - name: user_id
        description: Unique user identifier.
        data_tests:
          - unique
          - not_null

      - name: username_normalized
        description: Lowercase username without surrounding spaces.
        data_tests:
          - not_null

      - name: email
        data_tests:
          - unique
          - not_null

      - name: sex
        data_tests:
          - accepted_values:
              arguments:
                values: ["F", "M"]

      - name: birthdate
        description: Birthdate, NULL when invalid.

      - name: birthdate_is_valid
        description: Whether the original birthdate is valid.
        data_tests:
          - not_null

      - name: state
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('states')
                field: code

  - name: stg_orders
    description: Cleaned and deduplicated orders.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id

      - name: quantity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: product
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - bread
                  - brioche
                  - cookie
                  - croissant
                  - donut
                  - drink
