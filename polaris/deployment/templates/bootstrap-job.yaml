apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-bootstrap-script
data:
  bootstrap.py: |
{{ .Files.Get "files/bootstrap.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: python:3.13-alpine
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          command: ["python", "/scripts/bootstrap.py"]
          envFrom:
            - configMapRef:
                name: polaris-config
          env:
            - name: POLARIS_ROOT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-credential
                  key: POLARIS_ROOT_SECRET
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: polaris-bootstrap-script
